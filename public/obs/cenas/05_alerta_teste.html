<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>thecoinsquash — alerta</title>
<style>
  :root{
    --green:#9bdb5c;
    --gold:#f5b53c;
  }
  *{box-sizing:border-box}
  html,body{
    width:1920px; height:1080px; margin:0; overflow:hidden;
    background:transparent;
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    color:#fff;
  }

  .alerta{
    position:absolute;
    left:50%; top:120px;
    transform:translateX(-50%);
    display:flex; align-items:center; gap:28px;
    padding:22px 46px 22px 26px;
    border-radius:22px;
    border:3px solid var(--gold);
    background:linear-gradient(180deg,rgba(12,18,28,.94),rgba(6,9,15,.9));
    box-shadow:0 0 0 3px rgba(155,219,92,.25) inset, 0 24px 60px rgba(0,0,0,.6);
    opacity:0;
    pointer-events:none;
  }
  .alerta.entrando{animation:entra .7s cubic-bezier(.2,1.3,.4,1) forwards}
  .alerta.saindo{animation:sai .5s ease-in forwards}

  @keyframes entra{
    from{opacity:0; transform:translateX(-50%) translateY(-90px) scale(.9)}
    to{opacity:1; transform:translateX(-50%) translateY(0) scale(1)}
  }
  @keyframes sai{
    from{opacity:1; transform:translateX(-50%) translateY(0) scale(1)}
    to{opacity:0; transform:translateX(-50%) translateY(-60px) scale(.94)}
  }

  .texto{display:flex; flex-direction:column; gap:6px}
  .kicker{
    font-size:22px; letter-spacing:.26em; font-weight:800;
    color:var(--green); text-transform:uppercase;
  }
  .nome{
    font-size:58px; font-weight:900; line-height:1;
    color:var(--gold); letter-spacing:-1px;
    max-width:820px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* ---- moeda TheCoinSquash ---- */
  .coin{
    position:relative;
    width:118px; height:118px;
    flex:none;
    transform-style:preserve-3d;
    border-radius:50%;
  }
  .coin .face{position:absolute; inset:0; backface-visibility:hidden}
  .coin .face svg{width:100%; height:100%; display:block}
  .coin .back{transform:rotateY(180deg)}
  .alerta.entrando .coin{animation:coinspin 1.1s cubic-bezier(.15,.7,.3,1) 3}
  @keyframes coinspin{
    from{transform:rotateY(0deg) rotateX(8deg)}
    to{transform:rotateY(360deg) rotateX(8deg)}
  }

  .brilho{
    position:absolute; inset:-3px;
    border-radius:22px;
    border:1px solid rgba(155,219,92,.6);
    animation:pulso 1.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulso{
    0%,100%{opacity:.2}
    50%{opacity:.9; box-shadow:0 0 26px rgba(155,219,92,.4)}
  }

  /* ---- LOGO DO CANAL ----
     Substitui a moeda antiga. O arquivo logo.png precisa
     ficar NA MESMA PASTA deste html. */
  .coin{
    transform-style:flat !important;
    animation:cs-flutua 3.6s ease-in-out infinite !important;
    border-radius:0 !important;
    box-shadow:none !important;
    background:none !important;
  }
  .coin img{
    width:100%; height:100%;
    object-fit:contain;
    display:block;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));
  }
  @keyframes cs-flutua{
    0%,100%{transform:translateY(0) rotate(-1.5deg)}
    50%{transform:translateY(-7px) rotate(1.5deg)}
  }
</style>
</head>
<body>


<div class="alerta" id="alerta">
  <div class="brilho"></div>
  <div class="coin" aria-hidden="true"><img src="/obs/assets/logo.png" alt="thecoinsquash"></div>
  <div class="texto">
    <div class="kicker" id="kicker">NOVO SEGUIDOR</div>
    <div class="nome" id="nome">fulano</div>
  </div>
</div>

<script>
/* ============================================================
   ALERTA THECOINSQUASH

   MODO_TESTE = true  -> um alerta de mentira aparece a cada 12s,
                         para você posicionar a coisa no OBS.
   MODO_TESTE = false -> fica invisível, esperando eventos reais
                         do StreamElements.

   Deixe em true enquanto estiver montando. Depois troque para
   false e salve o arquivo.
   ============================================================ */
var MODO_TESTE = true;

var SEGUNDOS_NA_TELA = 5;

var elAlerta = document.getElementById("alerta");
var elNome   = document.getElementById("nome");
var elKicker = document.getElementById("kicker");
var ocupado  = false;

function mostrar(titulo, nome){
  if(ocupado) return;
  ocupado = true;
  elKicker.textContent = titulo;
  elNome.textContent = nome;
  elAlerta.className = "alerta entrando";

  setTimeout(function(){
    elAlerta.className = "alerta saindo";
    setTimeout(function(){
      elAlerta.className = "alerta";
      ocupado = false;
    }, 520);
  }, SEGUNDOS_NA_TELA * 1000);
}

/* Eventos reais do StreamElements (quando este código é colado
   num widget personalizado lá). Se não houver, nada acontece. */
window.addEventListener("onEventReceived", function(obj){
  if(!obj.detail || !obj.detail.event) return;
  var ev = obj.detail.event;
  var tipo = obj.detail.listener || "";
  var nome = ev.name || ev.displayName || "alguém";

  if(tipo.indexOf("follower") === 0)      mostrar("NOVO SEGUIDOR", nome);
  else if(tipo.indexOf("subscriber") === 0) mostrar("NOVO SUB", nome);
  else if(tipo.indexOf("tip") === 0)        mostrar("NOVA DOAÇÃO", nome);
  else if(tipo.indexOf("cheer") === 0)      mostrar("OBRIGADO PELOS BITS", nome);
});

/* Teste local */
if(MODO_TESTE){
  var nomesFalsos = ["joaozinho_tv", "marina", "pedro_gamer", "ana.clara"];
  var n = 0;
  setTimeout(function(){ mostrar("NOVO SEGUIDOR", nomesFalsos[0]); }, 1500);
  setInterval(function(){
    n = (n + 1) % nomesFalsos.length;
    mostrar("NOVO SEGUIDOR", nomesFalsos[n]);
  }, 12000);
}
</script>
</body>
</html>
