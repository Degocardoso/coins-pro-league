<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>thecoinsquash — gameplay (câmera em cima à direita)</title>
<!-- ==========================================================
     CAMERA CÂMERA EM CIMA À DIREITA
     No OBS, posicione a webcam com Ctrl+E usando:
         Posicao X: 1440      Posicao Y: 58
         Tamanho limitado: Esticar para os limites
         Largura: 422           Altura: 234
     Textos automaticos, se for usar. Os dois com Y 999,
     largura 190, altura 28, alinhados a DIREITA:
         Most Recent Follower ....  X 588
         Most Recent Subscriber ..  X 782
     ========================================================== -->
<style>
  :root{
    --green:#9bdb5c;
    --gold:#f5b53c;
  }
  *{box-sizing:border-box}
  html,body{
    width:1920px; height:1080px; margin:0; overflow:hidden;
    background:transparent !important;
    font-family:"Segoe UI",Arial,sans-serif;
  }

  .camera-wrap{
    position:absolute;
    right:54px;
    top:54px;
    width:430px;
    height:242px;
  }

  .shadow{
    position:absolute; inset:-9px;
    border-radius:24px;
    box-shadow:
      0 0 22px rgba(155,219,92,.22),
      0 0 42px rgba(245,181,60,.13);
  }

  .frame{
    position:absolute; inset:0;
    border-radius:19px;
    border:4px solid var(--gold);
    box-shadow:
      0 0 0 3px rgba(155,219,92,.72) inset,
      0 0 0 2px rgba(5,9,6,.9),
      0 0 20px rgba(155,219,92,.34);
    background:transparent;
  }

  .frame::before,
  .frame::after{
    content:"";
    position:absolute;
    height:5px;
    width:112px;
    top:-7px;
    background:linear-gradient(90deg,var(--gold),var(--green));
    box-shadow:0 0 13px rgba(155,219,92,.7);
  }
  .frame::before{left:30px;clip-path:polygon(0 0,100% 0,90% 100%,10% 100%)}
  .frame::after{right:30px;clip-path:polygon(0 0,100% 0,90% 100%,10% 100%)}

  .corner{position:absolute;width:42px;height:42px}
  .tl{left:-9px;top:-9px;border-left:6px solid var(--green);border-top:6px solid var(--green);border-radius:16px 0 0 0}
  .tr{right:-9px;top:-9px;border-right:6px solid var(--green);border-top:6px solid var(--green);border-radius:0 16px 0 0}
  .bl{left:-9px;bottom:-9px;border-left:6px solid var(--gold);border-bottom:6px solid var(--gold);border-radius:0 0 0 16px}
  .br{right:-9px;bottom:-9px;border-right:6px solid var(--gold);border-bottom:6px solid var(--gold);border-radius:0 0 16px 0}

  .tag{
    position:absolute;
    left:50%;
    bottom:-28px;
    transform:translateX(-50%);
    height:46px;
    padding:0 80px 0 24px;
    display:flex; align-items:center;
    background:linear-gradient(180deg,#0d1510,#050806);
    border:2px solid var(--gold);
    border-radius:10px;
    color:#fff;
    font-size:20px;
    font-weight:800;
    letter-spacing:.12em;
    white-space:nowrap;
    text-transform:lowercase;
    box-shadow:0 0 18px rgba(0,0,0,.55);
  }
  .tag .coinword{color:var(--gold)}
  .tag .squashword{color:var(--green)}

  .coin{
    position:absolute;
    right:-20px;
    bottom:-48px;
    width:84px; height:84px;
    transform-style:preserve-3d;
    border-radius:50%;
    animation:coinspin 3.4s linear infinite;
    z-index:5;
  }
  .coin .face{position:absolute; inset:0; backface-visibility:hidden}
  .coin .face svg{width:100%; height:100%; display:block}
  .coin .back{transform:rotateY(180deg)}
  @keyframes coinspin{
    from{transform:rotateY(0deg) rotateX(7deg)}
    to{transform:rotateY(360deg) rotateX(7deg)}
  }

  .pulse{
    position:absolute;
    inset:-3px;
    border-radius:21px;
    border:1px solid rgba(155,219,92,.55);
    animation:pulse 2.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulse{
    0%,100%{opacity:.25;box-shadow:0 0 5px rgba(155,219,92,.1)}
    50%{opacity:1;box-shadow:0 0 20px rgba(155,219,92,.45)}
  }

  /* ---- faixa inferior ----
     Areas reservadas para os textos automaticos, Y 999,
     largura 190, altura 28, alinhados a direita:
        ultimo seguidor X 588  |  ultimo sub X 782  */
  .ticker{
    position:absolute; left:54px; bottom:44px;
    width:940px; height:64px;
    border-radius:14px;
    border:2px solid rgba(245,181,60,.72);
    background:linear-gradient(180deg,rgba(10,15,24,.84),rgba(6,9,15,.72));
    box-shadow:0 0 0 2px rgba(155,219,92,.18) inset, 0 0 24px rgba(0,0,0,.5);
  }
  .tk-brand{position:absolute; left:22px; top:0; height:64px; display:flex; align-items:center; font-size:24px; font-weight:900; letter-spacing:-.5px; text-transform:lowercase; color:#fff}
  .tk-brand .coinword{color:var(--gold)}
  .tk-brand .squashword{color:var(--green)}
  .tk-sep{position:absolute; left:240px; top:16px; width:2px; height:32px; background:rgba(245,181,60,.45)}
  .tk-msg{position:absolute; left:264px; top:0; width:250px; height:64px; display:flex; align-items:center; font-size:20px; color:#d3dae6; transition:opacity .5s}
  .tk-slot{position:absolute; top:9px; width:190px; height:46px; text-align:right}
  .tk-slot.s1{left:534px}
  .tk-slot.s2{left:728px}
  .tk-label{display:block; height:18px; font-size:13px; letter-spacing:.14em; font-weight:800; color:var(--green)}
  .tk-value{display:block; height:28px}
</style>
<link rel="stylesheet" href="/obs/cpl.css">
</head>

  <div class="camera-wrap">
    <div class="shadow"></div>

<script>
  /* ================================================
     MENSAGENS DA FAIXA INFERIOR
     Troque, adicione ou remova linhas da lista abaixo.
     Cada uma fica 7 segundos no ar, em ordem.
     Mantenha as aspas e as virgulas.
     ================================================ */
  var MENSAGENS = [
    "Siga o canal para não perder as lives",
    "Manda um oi no chat",
    "@thecoinsquash em todas as redes",
    "Seg a sex 21h30, sábado 16h"
  ];

  var elMsg = document.getElementById("tkmsg");
  var idx = 0;

  function trocaMensagem(){
    elMsg.style.opacity = 0;
    setTimeout(function(){
      elMsg.textContent = MENSAGENS[idx];
      elMsg.style.opacity = 1;
      idx = (idx + 1) % MENSAGENS.length;
    }, 500);
  }
  elMsg.textContent = MENSAGENS[0];
  idx = 1;
  setInterval(trocaMensagem, 7000);
</script>
